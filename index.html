<meta charset="utf-8">

<style>
/* Layout: top bar + project cards; project detail = sticky summary strip + tabbed work areas (計畫書/預算/場次/核銷/資源/成果報告) */
:root{--bg:#f4f7f8;--surface:#ffffff;--fg:#14252b;--muted:#566b73;--line:#d6e0e4;--accent:#0b6b7a;--accent-fg:#ffffff;--accent-soft:#e0f0f3;--ok:#1f7a4d;--ok-bg:#dff2e6;--warn:#8a5a00;--warn-bg:#fbeccb;--bad:#b3261e;--bad-bg:#fbe0dd;--info:#2f5f9e;--info-bg:#e1ebf8;--field:#fbfdfd;--paper:#ffffff;--paper-fg:#161616;--paper-line:#8a8f91;--shadow:0 12px 40px rgba(10,30,36,.25);--sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a1e;--surface:#13252b;--fg:#e2edf0;--muted:#93a9b1;--line:#27393f;--accent:#5cc4d4;--accent-fg:#06222a;--accent-soft:#15373e;--ok:#78d6a1;--ok-bg:#16382a;--warn:#f0cf86;--warn-bg:#3d3012;--bad:#ff9d94;--bad-bg:#4a1f1b;--info:#9cc2f2;--info-bg:#1c3050;--field:#0f1f24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1a1e;--surface:#13252b;--fg:#e2edf0;--muted:#93a9b1;--line:#27393f;--accent:#5cc4d4;--accent-fg:#06222a;--accent-soft:#15373e;--ok:#78d6a1;--ok-bg:#16382a;--warn:#f0cf86;--warn-bg:#3d3012;--bad:#ff9d94;--bad-bg:#4a1f1b;--info:#9cc2f2;--info-bg:#1c3050;--field:#0f1f24;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:74rem;margin:0 auto;padding-inline:16px;padding-block:0 4rem}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1.2rem;padding-block:.6rem}
.brand{font-weight:700;font-size:1.05rem;margin-right:auto}
.who{display:flex;align-items:center;gap:.5rem;font-size:.85rem;color:var(--muted)}
.who select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.15rem .4rem}
.nav{display:flex;gap:.2rem;flex-wrap:wrap}
.nav button{background:none;border:0;padding:.35rem .8rem;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.nav button:hover{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font-size:1.5rem;margin:1.4rem 0 .2rem;text-wrap:balance}
h2{font-size:1.1rem;margin:0}
h3{font-size:.95rem;margin:0}
.sub{color:var(--muted);margin:0 0 1rem;font-size:.9rem}
.bar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between;margin-block:1rem .8rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:.35rem .85rem;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-fg)}
.btn.bad{color:var(--bad)}
.btn.sm{padding:.1rem .55rem;font-size:.8rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));gap:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:1rem;display:flex;flex-direction:column;gap:.55rem;min-width:0;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--accent)}
.card .t{font-weight:700;font-size:1.02rem;overflow-wrap:anywhere}
.card .m{font-size:.8rem;color:var(--muted);display:flex;gap:.6rem;flex-wrap:wrap}
.card .bal{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
.card .bal b{font-size:1.3rem;font-variant-numeric:tabular-nums}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.hi i{background:#d08a00}.meter.over i{background:var(--bad)}
.rem{font-size:.85rem;color:var(--muted)}
.rem.today{color:var(--accent);font-weight:700}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:.05rem .6rem;border-radius:99px;background:var(--info-bg);color:var(--info);white-space:nowrap}
.pill.draft{background:var(--line);color:var(--muted)}.pill.run{background:var(--ok-bg);color:var(--ok)}.pill.wait{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.flag{font-size:.78rem;font-weight:700;color:var(--bad);background:var(--bad-bg);padding:.05rem .5rem;border-radius:4px;align-self:flex-start}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:2rem 1.2rem;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:1.05rem;margin-bottom:.3rem}
.empty .row{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:1rem}
.crumb{font-size:.85rem;margin-top:1rem}.crumb button{background:none;border:0;color:var(--accent);cursor:pointer;padding:0}
.phead{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:flex-start;justify-content:space-between}
.phead h1{margin-top:.3rem}
.actions{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-block:.8rem}
.strip div{background:var(--surface);padding:.55rem .8rem;box-shadow:inset -1px -1px 0 var(--line)}
.strip small{display:block;color:var(--muted);font-size:.75rem}
.strip b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.strip .neg b{color:var(--bad)}
.tabs{display:flex;gap:.1rem;overflow-x:auto;border-bottom:1px solid var(--line);margin-block:1rem .9rem}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:.5rem .9rem;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:1rem;min-width:0}
.sec>header{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:space-between;align-items:center;padding:.65rem .9rem;border-bottom:1px solid var(--line)}
.sec .body{padding:.8rem .9rem}
.sec .body.flush{padding:0}
.sec p.hint{margin:0;color:var(--muted);font-size:.85rem}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:.35rem 1rem;margin:0}
dl.kv dt{color:var(--muted);font-size:.85rem}dl.kv dd{margin:0;overflow-wrap:anywhere}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;vertical-align:top;padding:.45rem .7rem;border-bottom:1px solid var(--line)}
th{font-size:.74rem;color:var(--muted);letter-spacing:.05em;white-space:nowrap;background:var(--field)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.act{white-space:nowrap;text-align:right}
tfoot td{font-weight:700;background:var(--field)}
tr.neg td.bal{color:var(--bad);font-weight:700}
.note{padding:.6rem .9rem;border-radius:6px;font-size:.88rem;margin-bottom:1rem}
.note.bad{background:var(--bad-bg);color:var(--bad)}.note.warn{background:var(--warn-bg);color:var(--warn)}.note.info{background:var(--info-bg);color:var(--info)}.note.ok{background:var(--ok-bg);color:var(--ok)}
.ev{border-top:1px solid var(--line);padding:.8rem .9rem}
.ev:first-child{border-top:0}
.ev .h{display:flex;flex-wrap:wrap;gap:.3rem .8rem;align-items:baseline;justify-content:space-between}
.ev .h b{font-size:1rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.chip{display:inline-flex;gap:.4rem;align-items:center;background:var(--accent-soft);border-radius:99px;padding:.05rem .3rem .05rem .7rem;font-size:.82rem}
.chip button{background:none;border:0;cursor:pointer;color:var(--muted);padding:0 .3rem}
.chip button:hover{color:var(--accent)}
.rest{white-space:pre-wrap;overflow-wrap:anywhere}
.logs{font-size:.82rem;color:var(--muted);margin-top:.4rem}
.ov{position:fixed;inset:0;background:rgba(5,15,20,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(4vh,env(safe-area-inset-top,0px)) 12px 4vh}
.modal{background:var(--surface);border-radius:10px;box-shadow:var(--shadow);width:100%;max-width:36rem;margin:auto 0}
.modal>header{padding:.9rem 1.1rem;border-bottom:1px solid var(--line);font-weight:700}
.modal form{padding:1rem 1.1rem;display:grid;gap:.8rem}
.fld label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:.15rem}
.fld label i{color:var(--bad);font-style:normal}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld input[type=time],.fld select,.fld textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:.4rem .6rem}
.fld textarea{min-height:5.5rem;resize:vertical}
.fld .help{font-size:.78rem;color:var(--muted);margin-top:.15rem}
.fld .multi{display:grid;grid-template-columns:repeat(auto-fill,minmax(10rem,1fr));gap:.2rem .8rem;max-height:11rem;overflow-y:auto;border:1px solid var(--line);border-radius:6px;padding:.4rem .6rem;background:var(--field)}
.fld .multi label{display:flex;gap:.4rem;align-items:flex-start;font-size:.85rem;color:var(--fg);margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.err{color:var(--bad);font-size:.85rem;min-height:1.2em}
.foot{display:flex;justify-content:flex-end;gap:.5rem}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:.5rem 1rem;border-radius:6px;z-index:60;font-size:.88rem;max-width:90vw}
.paper{background:var(--paper);color:var(--paper-fg);border:1px solid var(--line);border-radius:4px;padding:clamp(14px,4vw,40px);overflow-x:auto;font-size:.9rem}
.paper h1{text-align:center;font-size:1.25rem;margin:.2rem 0}
.paper h4{margin:1.1rem 0 .3rem;font-size:.98rem}
.paper table{min-width:30rem;color:var(--paper-fg)}
.paper th,.paper td{border:1px solid var(--paper-line);background:none;color:var(--paper-fg);letter-spacing:0;font-size:.85rem;padding:.3rem .5rem}
.paper th{background:#eceeee;font-weight:700}
.paper .photo td{height:7rem}
.paper p{margin:.2rem 0;white-space:pre-wrap}
.ro{font-size:.82rem}

.held{margin-top:.5rem;padding:.5rem .7rem;border-radius:6px;background:var(--warn-bg);color:var(--warn);font-size:.85rem}
.held.late{background:var(--bad-bg);color:var(--bad)}
.held ul{margin:.3rem 0 0;padding-left:1.1rem}
.flag.warn{color:var(--warn);background:var(--warn-bg)}
.modal.wide{max-width:72rem}
.pg input[type=number]{width:5.6rem;text-align:right;background:var(--field);border:1px solid var(--line);border-radius:4px;padding:.2rem .3rem}
.pg input[type=text]{width:9rem;background:var(--field);border:1px solid var(--line);border-radius:4px;padding:.2rem .4rem}
.pg td,.pg th{padding:.25rem .3rem}
.chk{padding:.5rem .8rem;border-radius:6px;font-weight:500}
.chk.ok{background:var(--ok-bg);color:var(--ok)}.chk.bad{background:var(--bad-bg);color:var(--bad)}
.lay2{display:grid;grid-template-columns:17rem minmax(0,1fr);gap:1rem;align-items:start}
@media (max-width:860px){.lay2{grid-template-columns:1fr}}
.vers{display:grid;gap:.5rem}
.ver{text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.6rem .8rem;cursor:pointer}
.ver[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.ver b{display:flex;justify-content:space-between;gap:.4rem}
.ver small{display:block;color:var(--muted);overflow-wrap:anywhere}
.mx td.over{background:var(--bad-bg);color:var(--bad);font-weight:700}
.mx td.z{color:var(--muted)}
.mx small.up{display:block;color:var(--ok);font-size:.7rem}.mx small.dn{display:block;color:var(--bad);font-size:.7rem}
.seg{display:flex;flex-wrap:wrap;gap:.3rem}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:.15rem .8rem;cursor:pointer;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

.paste{border:2px dashed var(--line);border-radius:6px;padding:.8rem;text-align:center;color:var(--muted);cursor:pointer;background:var(--field)}
.paste:focus{border-color:var(--accent);outline:none;color:var(--fg)}
.pprev img{max-width:100%;max-height:12rem;border-radius:6px;margin-top:.4rem}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(9rem,1fr));gap:.6rem}.phgrid figure{margin:0;display:grid;gap:.3rem;justify-items:start}.phgrid img{width:100%;height:7rem;object-fit:cover;border-radius:6px}.paper .ph img{height:auto;max-width:100%}
.thumb{height:3.6rem;width:auto;max-width:6rem;object-fit:cover;border-radius:4px;display:block}
.photobox{display:grid;gap:.4rem}
.nm{display:block;color:var(--muted);font-size:.75rem;font-weight:400}
.mvb{display:inline-flex;gap:.2rem}
@media (max-width:560px){.two{grid-template-columns:1fr}dl.kv{grid-template-columns:1fr}.strip b{font-size:1rem}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

/* ===== 雲端版:登入、選單、手機適配 ===== */
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lgov{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));overflow-y:auto}
.lgbox{width:100%;max-width:24rem;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:1.3rem 1.2rem;display:grid;gap:.8rem;margin:auto}
.lgbox h2{font-size:1.25rem;margin:0}
.lgbox h3{font-size:.95rem;margin:.4rem 0 .2rem}
.lgbox label{font-size:.85rem;color:var(--muted);display:block;margin-bottom:.2rem}
.lgbox select,.lgbox input[type=password],.lgbox input[type=text]{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:.6rem .65rem;font-size:16px}
.lgerr{color:var(--bad);font-size:.85rem;min-height:1.3em}
.more{position:relative}
.more>summary{list-style:none;cursor:pointer;display:inline-block}
.more>summary::-webkit-details-marker{display:none}
.more .menu{position:absolute;right:0;top:calc(100% + 4px);z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:.3rem;display:grid;gap:.15rem;min-width:9.5rem}
.more .menu .btn{text-align:left;border:0;padding:.45rem .7rem;font-size:.9rem}
.cloudflash{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:310;background:var(--ok);color:var(--surface);border-radius:8px;padding:8px 14px;font-size:14px;opacity:0;transition:opacity .4s;box-shadow:0 2px 10px rgba(0,0,0,.25);pointer-events:none;max-width:90vw;text-align:center}
.toast{max-width:90vw}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:700px){
 input,select,textarea{font-size:16px}
 .wrap{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
 .top .wrap{gap:.3rem .5rem}
 .brand{flex:1 1 100%;margin-right:0}
 .nav{order:3;flex:1 1 100%;overflow-x:auto;flex-wrap:nowrap}
 .nav button{white-space:nowrap;padding:.5rem .8rem}
 .who{flex-wrap:wrap;gap:.35rem}
 .btn{min-height:38px}.btn.sm{min-height:34px}
 h1{font-size:1.25rem}
 .bar,.actions{gap:.45rem}
 .cards{grid-template-columns:1fr}
 .ov{padding:max(2vh,env(safe-area-inset-top,0px)) 6px 2vh}
 .modal{max-width:100%}
 .tabs button{padding:.6rem .8rem;white-space:nowrap}
 table{font-size:.82rem}
}

/* ===== 督導系統 ===== */
.hb{display:grid;grid-template-columns:minmax(5rem,10rem) 1fr minmax(6rem,auto);gap:.6rem;align-items:center;font-size:.85rem;margin:.3rem 0}
.hb .trk{position:relative;height:14px;background:var(--line);border-radius:4px;overflow:hidden;display:block}
.hb .trk i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);display:block}
.hb .trk i.b{background:var(--info);opacity:.45}
.hb.over .trk i:not(.b){background:var(--bad)}
.hb>span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.evlist{display:grid;gap:.15rem;max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:.3rem}
.evpick{display:grid;grid-template-columns:auto 4.6rem 1fr auto;gap:.6rem;align-items:center;padding:.45rem .5rem;border-radius:6px;cursor:pointer}
.evpick:hover{background:var(--accent-soft)}
.evpick input{width:20px;height:20px;margin:0}
.evpick .d{font-weight:600;font-variant-numeric:tabular-nums}
.evpick small{display:block;color:var(--muted);font-weight:400;font-size:.78rem}
.evpick .n b{display:block}
.evpick .m{text-align:right}
@media (max-width:700px){
 .hb{grid-template-columns:5.2rem 1fr}.hb>span:last-child{grid-column:1/-1;text-align:left}
 .evpick{grid-template-columns:auto 1fr}.evpick .d,.evpick .n,.evpick .m{grid-column:2;text-align:left}
}
@media print{
 body *{visibility:hidden!important}
 #suprep,#suprep *{visibility:visible!important}
 #suprep{position:absolute;left:0;top:0;width:100%;border:0!important;box-shadow:none!important;margin:0}
 #suprep h4{break-after:avoid}
 #suprep table,#suprep figure{break-inside:avoid}
 .phgrid{grid-template-columns:repeat(3,1fr)}
}

.evgrp{display:grid;gap:.1rem;margin-bottom:.4rem}
.evgrp .gh{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.5rem .6rem;background:var(--accent-soft);border-radius:6px;position:sticky;top:0;z-index:1}
.evgrp .gh small{color:var(--muted);font-size:.8rem}
.evgrp .gh .btn{margin-left:auto}

.phflow{display:flex;flex-wrap:wrap;gap:.7rem;align-items:flex-start;margin:.4rem 0}
.phflow figure{margin:0;max-width:100%;break-inside:avoid}
.phflow img{display:block;height:auto;max-width:100%;border-radius:0}
</style>

</head>

var status='idle',lastOk=null,syncing=false,again=false,timer=null,flashEl=null,flashT=null,reauthP=null;

function now(){return Date.now()+skew}
function rid(){try{return crypto.randomUUID().replace(/-/g,'').slice(0,20)}catch(e){return 'd'+Date.now().toString(36)+Math.random().toString(36).slice(2,10)}}
function p2(n){return String(n).padStart(2,'0')}
function hms(d){return p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())}
function cfgOk(){return /^https:\/\/script\.google\.com\//.test(CFG.GAS_URL)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

/* ---------- 與 Apps Script 溝通(text/plain 避免 CORS 預檢) ---------- */
async function api(body,ms){
  var ctl=new AbortController(),t=setTimeout(function(){ctl.abort()},ms||90000);
  try{
    var r=await fetch(CFG.GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),signal:ctl.signal});
    var j=await r.json();if(j&&j.now)skew=j.now-Date.now();return j;
  }finally{clearTimeout(t)}
}

/* ---------- 本機快取(每個帳號各自一個資料庫) ---------- */
function idbOpen(uid){return new Promise(function(res,rej){var r=indexedDB.open('fanganCloud_'+uid,1);r.onupgradeneeded=function(){var d=r.result;d.createObjectStore('docs');d.createObjectStore('meta')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
function idbPut(k,e){if(!idb)return;try{idb.transaction('docs','readwrite').objectStore('docs').put(e,k)}catch(x){}}
function metaPut(k,v){if(!idb)return;try{idb.transaction('meta','readwrite').objectStore('meta').put(v,k)}catch(x){}}
function metaGet(k){return new Promise(function(res){if(!idb)return res(null);try{var q=idb.transaction('meta').objectStore('meta').get(k);q.onsuccess=function(){res(q.result||null)};q.onerror=function(){res(null)}}catch(x){res(null)}})}
async function loadLocal(uid){
  try{idb=await idbOpen(uid)}catch(e){idb=null;return}
  await new Promise(function(res){var q=idb.transaction('docs').objectStore('docs').openCursor();q.onsuccess=function(){var c=q.result;if(c){var k=String(c.key),i=k.indexOf('/'),col=k.slice(0,i),id=k.slice(i+1);(store[col]=store[col]||{})[id]=c.value;if(c.value.p)pend.add(k);c['continue']()}else res()};q.onerror=function(){res()}});
  rev=(await metaGet('rev'))||0;
}

/* ---------- 資料存取(與原 claude.ai db 介面相同) ---------- */
function snap(col){var m=store[col]||{},ids=Object.keys(m).filter(function(id){return!m[id].d});return{docs:ids.map(function(id){return{id:id,exists:true,data:function(){return Object.assign({},m[id].v)}}}),size:ids.length}}
function fire(col){(subs[col]||[]).forEach(function(f){try{f(snap(col))}catch(e){}})}
function putLocal(col,id,val,del){
  var m=(store[col]=store[col]||{}),ex=m[id],u=Math.max(now(),ex?ex.u+1:0);
  var e={u:u,d:del?1:0,v:del?null:val,p:1};m[id]=e;pend.add(col+'/'+id);idbPut(col+'/'+id,e);
}
var db={collection:function(col){return{
  doc:function(id){id=id||rid();return{id:id,
    set:async function(d){putLocal(col,id,JSON.parse(JSON.stringify(d)));fire(col);markDirty()},
    update:async function(d){var ex=(store[col]||{})[id];var base=ex&&!ex.d?ex.v:{};putLocal(col,id,Object.assign({},base,JSON.parse(JSON.stringify(d))));fire(col);markDirty()},
    'delete':async function(){putLocal(col,id,null,true);fire(col);markDirty()}}},
  onSnapshot:function(f){(subs[col]=subs[col]||[]).push(f);Promise.resolve().then(function(){f(snap(col))});return function(){subs[col]=(subs[col]||[]).filter(function(x){return x!==f})}}}}};
var user={me:async function(){return{id:session.uid,name:session.name||''}},can:async function(){return true},profiles:async function(){return{}}};
var downloads={save:async function(r){var d=r.data,blob=d instanceof Blob?d:new Blob([d]);var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=r.filename;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);return{status:'saved'}}};

/* ---------- 同步 ---------- */
function labelText(){
  var n=pend.size;
  return status==='syncing'?'☁ 同步中…':status==='pending'?'☁ 待同步('+n+')':status==='ok'?'☁ 已同步 '+(lastOk?hms(lastOk):''):
    status==='offline'?'⚠ 離線,待同步('+n+')':status==='err'?'⚠ 同步失敗,點此重試':status==='auth'?'⚠ 請重新登入':'☁ 尚未同步'}
function setStatus(s){status=s;var t=labelText();document.querySelectorAll('[data-cloudst]').forEach(function(b){b.textContent=t;b.style.color=(s==='err'||s==='offline'||s==='auth')?'var(--bad)':''})}
function flash(t){if(!flashEl){flashEl=document.createElement('div');flashEl.setAttribute('role','status');flashEl.className='cloudflash';document.body.appendChild(flashEl)}flashEl.textContent=t;flashEl.style.opacity='1';clearTimeout(flashT);flashT=setTimeout(function(){flashEl.style.opacity='0'},3500)}
function markDirty(){clearTimeout(timer);setStatus('pending');timer=setTimeout(function(){sync()},3000)}
function applyIn(list){
  var cols={};
  list.forEach(function(c){var i=c.k.indexOf('/'),col=c.k.slice(0,i),id=c.k.slice(i+1),ex=(store[col]||{})[id];
    if(ex&&ex.p&&ex.u>c.u)return;                       // 本機有更新的未同步修改,保留
    var e={u:c.u,d:c.d?1:0,v:c.d?null:c.v};(store[col]=store[col]||{})[id]=e;pend['delete'](c.k);idbPut(c.k,e);cols[col]=1});
  Object.keys(cols).forEach(fire);
}
function takeBatch(){
  var list=[],size=0,it=pend.values(),n=it.next();
  while(!n.done){var k=n.value,i=k.indexOf('/'),e=(store[k.slice(0,i)]||{})[k.slice(i+1)];
    if(!e){pend['delete'](k)}else{var sz=e.d?60:JSON.stringify(e.v).length+60;if(list.length&&size+sz>2500000)break;list.push({k:k,u:e.u,d:e.d?1:0,v:e.d?null:e.v});size+=sz}
    n=it.next()}
  return list;
}
async function sync(){
  if(!session||!cfgOk())return false;
  if(syncing){again=true;return false}
  syncing=true;setStatus('syncing');var pushed=0,guard=0;
  try{
    do{
      again=false;
      var batch=takeBatch();
      var r=await api({action:'sync',token:session.token,since:rev,changes:batch});
      if(!r||!r.ok){
        if(r&&r.err==='auth'){setStatus('auth');syncing=false;await reauth();return sync()}
        throw new Error(r&&r.msg||'sync')}
      if(r.role&&r.role!==session.role){session.role=r.role;try{localStorage.setItem(SKEY,JSON.stringify(session))}catch(x){}}
      batch.forEach(function(c){var i=c.k.indexOf('/'),e=(store[c.k.slice(0,i)]||{})[c.k.slice(i+1)];if(e&&e.p&&e.u===c.u){delete e.p;pend['delete'](c.k);idbPut(c.k,e)}});
      pushed+=batch.length;applyIn(r.changes);rev=r.upTo;metaPut('rev',rev);
      if(pend.size>0||r.more)again=true;
    }while(again&&++guard<300);
    lastOk=new Date();setStatus(pend.size?'pending':'ok');
    if(pushed)flash('✔ 已同步到你的 Google 雲端資料夾 '+hms(lastOk));
    return true;
  }catch(e){setStatus(navigator.onLine===false?'offline':'err');return false}
  finally{syncing=false}
}

/* ---------- 登入畫面 ---------- */
function loginFlow(prefUid,msg,lock){
  return new Promise(function(resolve){
    var o=document.createElement('div');o.className='lgov';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');o.setAttribute('aria-labelledby','lgt');
    o.innerHTML='<form class="lgbox" id="lgf" autocomplete="on"><h2 id="lgt">方案成果管理系統</h2><div class="sub" style="margin:0">'+(lock?'登入已逾時,請重新輸入密碼。尚未同步的修改仍保留在這個裝置,登入後會自動補上傳。':'請選擇你的姓名,輸入密碼後登入。只能開啟自己的資料。')+'</div>'
     +'<div><label for="lgu">我的姓名</label><select id="lgu" required><option value="">載入名單中…</option></select></div>'
     +'<div><label for="lgp">密碼(第一次請輸入系統預設密碼)</label><input id="lgp" type="password" autocomplete="current-password" required></div>'
     +'<label style="display:flex;gap:.4rem;align-items:center;margin:0"><input type="checkbox" id="lgs"> 顯示密碼</label>'
     +'<div class="lgerr" id="lge" role="alert">'+esc(msg||'')+'</div>'
     +'<button class="btn pri" id="lgb" type="submit" style="padding:.6rem">登入</button>'
     +'<div class="sub" style="margin:0;font-size:.78rem">'+VER+'。忘記密碼請聯絡系統管理員重設。</div></form>';
    document.body.appendChild(o);
    var sel=o.querySelector('#lgu'),pw=o.querySelector('#lgp'),err=o.querySelector('#lge'),btn=o.querySelector('#lgb');
    o.querySelector('#lgs').onchange=function(){pw.type=this.checked?'text':'password'};
    function setErr(t){err.textContent=t}
    async function loadUsers(){
      if(!cfgOk()){sel.innerHTML='<option value="">(尚未設定雲端網址)</option>';setErr('管理員尚未把 Apps Script 網址貼進網頁最上方的 GAS_URL。');return}
      try{
        var r=await api({action:'users'},25000);
        if(!r||!r.ok||!r.users)throw 0;
        sel.innerHTML='<option value="">請選擇姓名</option>'+r.users.map(function(u){return'<option value="'+esc(u.id)+'">'+esc(u.name)+'</option>'}).join('');
        if(prefUid&&r.users.some(function(u){return u.id===prefUid}))sel.value=prefUid;
        if(lock){sel.value=prefUid;sel.disabled=true}
        (sel.value?pw:sel).focus();
      }catch(e){sel.innerHTML='<option value="">(名單載入失敗)</option>';setErr('無法連線到雲端,請檢查網路後重新整理頁面。')}
    }
    o.querySelector('#lgf').onsubmit=async function(ev){
      ev.preventDefault();if(!sel.value){setErr('請先選擇姓名');return}
      btn.disabled=true;btn.textContent='登入中…';setErr('');
      try{
        var r=await api({action:'login',uid:sel.value,pwd:pw.value},40000);
        if(r&&r.ok){
          var s={uid:r.uid,name:r.name,role:r.role,token:r.token,exp:r.exp};
          try{localStorage.setItem(SKEY,JSON.stringify(s));localStorage.setItem(LKEY,s.uid)}catch(e){}
          o.remove();resolve(s);return}
        setErr(r&&r.err==='locked'?'密碼錯誤次數過多,已暫時鎖定,請 '+(r.min||10)+' 分鐘後再試。':r&&r.err==='cred'?'密碼不正確'+(r.left!=null?'(還可再試 '+r.left+' 次)':'')+'。':'登入失敗,請稍後再試。');
      }catch(e){setErr('無法連線到雲端,請檢查網路後再試。')}
      btn.disabled=false;btn.textContent='登入';pw.select();
    };
    loadUsers();
  });
}
function reauth(){
  if(!reauthP)reauthP=loginFlow(session.uid,'',true).then(function(s){session=s;reauthP=null;return s});
  return reauthP;
}

/* ---------- 修改密碼 / 登出 ---------- */
function chpwd(){
  if(document.getElementById('pwov'))return;
  var o=document.createElement('div');o.id='pwov';o.className='lgov';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');
  o.innerHTML='<form class="lgbox"><h2>修改密碼</h2><div><label for="pw0">目前密碼</label><input id="pw0" type="password" autocomplete="current-password" required></div><div><label for="pw1">新密碼(至少 6 碼)</label><input id="pw1" type="password" autocomplete="new-password" required minlength="6"></div><div><label for="pw2">再輸入一次新密碼</label><input id="pw2" type="password" autocomplete="new-password" required minlength="6"></div><div class="lgerr" role="alert"></div><div style="display:flex;gap:.5rem;justify-content:flex-end"><button type="button" class="btn" id="pwc">取消</button><button type="submit" class="btn pri">更改</button></div></form>';
  document.body.appendChild(o);o.querySelector('#pw0').focus();
  var err=o.querySelector('.lgerr');o.querySelector('#pwc').onclick=function(){o.remove()};
  o.querySelector('form').onsubmit=async function(ev){
    ev.preventDefault();var a=o.querySelector('#pw0').value,b=o.querySelector('#pw1').value,c=o.querySelector('#pw2').value;
    if(b!==c){err.textContent='兩次輸入的新密碼不一樣';return}
    if(b.length<6){err.textContent='新密碼至少 6 碼';return}
    err.textContent='處理中…';
    try{var r=await api({action:'chpwd',token:session.token,oldPwd:a,newPwd:b},40000);
      if(r&&r.ok){session.token=r.token;session.exp=r.exp;try{localStorage.setItem(SKEY,JSON.stringify(session))}catch(e){}o.remove();flash('✔ 密碼已更改');return}
      err.textContent=r&&r.err==='cred'?'目前密碼不正確':r&&r.err==='auth'?'登入已逾時,請重新登入':'更改失敗,請稍後再試'}
    catch(e){err.textContent='無法連線到雲端'}};
}
async function logout(){
  if(pend.size){setStatus('syncing');await sync()}
  if(pend.size&&!window.confirm('還有 '+pend.size+' 筆修改尚未上傳到雲端(可能是沒有網路)。現在登出會遺失這些修改,確定要登出嗎?'))return;
  var uid=session&&session.uid;
  try{localStorage.removeItem(SKEY)}catch(e){}
  try{if(idb)idb.close()}catch(e){}
  var done=false;function go(){if(done)return;done=true;location.reload()}
  try{var q=indexedDB.deleteDatabase('fanganCloud_'+uid);q.onsuccess=q.onerror=q.onblocked=go}catch(e){go()}
  setTimeout(go,1500);
}

async function teamCall(body){
  var r=await api(Object.assign({token:session.token},body),150000);
  if(r&&r.err==='auth'){await reauth();r=await api(Object.assign({token:session.token},body),150000)}
  if(!r||!r.ok)throw new Error(r&&r.err==='forbidden'?'此帳號沒有督導權限':r&&r.err==='auth'?'登入已逾時,請重新登入':(r&&r.msg)||'無法連線到雲端');
  return r;
}

/* ---------- 啟動:登入 → 載入本機快取 → 第一次同步 ---------- */
var gate=(async function(){
  var saved=null;try{saved=JSON.parse(localStorage.getItem(SKEY)||'null')}catch(e){}
  if(saved&&saved.token&&saved.uid&&saved.exp>Date.now()+60000)session=saved;
  else{
    var pref=saved&&saved.uid||null;if(!pref){try{pref=localStorage.getItem(LKEY)}catch(e){}}
    session=await loginFlow(pref,'',false);
  }
  await loadLocal(session.uid);
  if(cfgOk()){await Promise.race([sync(),new Promise(function(r){setTimeout(r,20000)})])}
  var live=store.staff&&store.staff[session.uid]&&!store.staff[session.uid].d;

<script>

function fyOfDate(ds){var m=/^(\d{4})-(\d{2})/.exec(ds||'');if(!m)return'';var y=+m[1],mo=+m[2];return'FY'+(y-2000+(mo>=10?1:0))}

async function saveDoc(col,id,data){
  try{
    if(col==='staff'){var cur=Object.assign({},S.staff.get(id)||{});delete cur.id;await db.collection('staff').doc(id).set(Object.assign(cur,data))}
    else if(id){await db.collection(col).doc(id).update(data)}

    return id;
  }catch(e){toast(e&&e.code==='quota_exceeded'?'資料量已達上限,請先刪除不需要的紀錄':'儲存失敗('+(e&&e.code||'錯誤')+'),請稍後再試');throw e}
}

async function shrink(blob,mx,lim){var bmp=await createImageBitmap(blob),max=mx||640,lim=lim||170000,q=.75,sc=Math.min(1,max/Math.max(bmp.width,bmp.height));

function fieldHTML(f,val){

  }else if(f.t==='ids')h='<textarea id="'+id+'" name="'+f.k+'">'+esc(Array.isArray(val)?val.join('、'):v)+'</textarea>';
  else if(f.t==='tags')h='<input type="text" id="'+id+'" name="'+f.k+'" value="'+esc(Array.isArray(val)?val.join('、'):v)+'">';
  else{var ty=f.t==='num'||f.t==='money'?'number':f.t;h='<input type="'+ty+'" id="'+id+'" name="'+f.k+'" value="'+esc(v)+'"'+(ty==='number'?' step="any" inputmode="decimal"':'')+(f.min?' min="'+f.min+'"':'')+(f.max?' max="'+f.max+'"':'')+(f.ph?' placeholder="'+esc(f.ph)+'"':'')+(f.list?' list="dl_'+f.k+'"':'')+'>'+(f.list?'<datalist id="dl_'+f.k+'">'+f.list.map(function(x){return'<option value="'+esc(x)+'">'}).join('')+'</datalist>':'')}

function openForm(entKey,pid,old,extra){
  var E=ENT[entKey],ctx=Object.assign({},extra||{},old||{});
  var vals=Object.assign({},E.init?E.init(pid):{},extra||{},old||{});if(entKey==='event')vals.status=evSt(vals);
  var fields=E.fields(pid,ctx);

  var pairs=[];var out='';
  // two-column pairs for short fields

  while(i<parts.length){var a=parts[i],b=parts[i+1];
    var short=function(x){return['num','money','date','time','select'].indexOf(x.f.t)>=0&&!(x.f.opts&&x.f.opts.length>12)};

  modalOpen=true;

  if(entKey==='project'){var sd=form.querySelector('[name="startDate"]'),ms=form.querySelector('[name="month"]');
    if(sd&&ms)sd.addEventListener('change',function(){var m=/^\d{4}-(\d{2})/.exec(sd.value);if(m){ms.value=(+m[1])+'月'}})}
  form.addEventListener('submit',async function(ev){
    ev.preventDefault();var err=document.getElementById('merr');err.textContent='';

      else if(typeof raw==='string')raw=raw.trim();
      if(f.req&&(raw===''||raw==null||(Array.isArray(raw)&&!raw.length))){err.textContent='請填寫「'+f.l+'」。';return}
      v[f.k]=raw}
    if(E.validate){var m=E.validate(v,old,pid);if(m){err.textContent=m;return}}
    if(E.before)v=E.before(v);
    if(E.save){var b0=document.getElementById('msave');b0.disabled=true;try{await E.save(v,old,pid,extra);closeModal();sched()}catch(e){b0.disabled=false}return}
    if(entKey==='attendance'&&extra&&extra.eventId)v.eventId=extra.eventId;
    if(['project','eval','supnote','profile'].indexOf(entKey)<0)v.projectId=pid;
    var btn=document.getElementById('msave');btn.disabled=true;

      var id=await saveDoc(E.col,old&&old.id,v);
      closeModal();
      if(entKey==='project'&&!old){V.tab='project';V.pid=id;V.ptab='plan'}
      sched();
    }catch(e){btn.disabled=false}
  });
}

function poaParse(sheets){

  if(hi<0)return{err:'找不到表頭「事工編碼」,請使用範本。'};

    var vals={},bad=null;MONTHS.forEach(function(m){if(mi[m]==null)return;var raw=String(r[mi[m]]==null?'':r[mi[m]]).replace(/[,\s$]/g,'');if(raw==='')return;var v=Number(raw);if(isNaN(v)||v<0){bad=m;return}vals[m]=v});
    if(bad){warns.push('第 '+(hi+n+2)+' 列「'+code+'」的'+bad+'金額不是 0 以上的數字,該月略過');}

    items=items.filter(function(x){return x.code!==code});items.push({code:code,name:ni>=0?String(r[ni]==null?'':r[ni]).trim():'',vals:vals})});
  if(!items.length)return{err:'沒有可匯入的資料列。'};
  return{items:items,warns:warns}}

async function supLoad(force){
  if(TM.loading)return;
  if(!force&&TS&&TM.at&&Date.now()-TM.at<120000)return;
  TM.loading=true;TM.err='';sched();
  try{
    var r=await window.__team.load(),ns={};

/* ----- 共用計算 ----- */
function supProjects(){
  var out=[];
  TS.projects.forEach(function(p){
    if(SV.fy&&(p.fy||'FY26')!==SV.fy)return;
    if(SV.center&&(p.center||'')!==SV.center)return;
    if(SV.owner&&p.owner!==SV.owner)return;
    if(SV.st&&pst(p)!==SV.st)return;
    out.push(p)});
  return out.sort(function(a,b){var x=supOwner(a),y=supOwner(b);return x>y?1:x<y?-1:((a.code||'')>(b.code||'')?1:-1)});
}
function supFlags(p,c){
  var f=[],td=today(),late=0,nos=0,nop=0;
  if(c.total>0&&c.spent>c.total)f.push('核銷超過預算');
  if(c.overdue.length)f.push('保留款逾期 '+c.overdue.length+' 筆');
  if(c.poaOver)f.push('預算超出 POA');
  c.EV.forEach(function(e){var st=evSt(e);
    if(st==='未辦理'&&(e.endDate||e.date||'9')<td)late++;
    if(st==='已辦理'&&!String(e.summary||'').trim())nos++;
    if(st==='已辦理'&&!(e.phN>0))nop++});
  if(late)f.push('過期未標記辦理 '+late+' 場');
  if(nos)f.push('已辦理缺執行概況 '+nos+' 場');
  if(nop)f.push('已辦理無照片 '+nop+' 場');
  return f;
}
function supEvCount(c){var done=0,all=0;c.EV.forEach(function(e){var s=evSt(e);if(s!=='取消')all++;if(s==='已辦理')done++});return{done:done,all:all}}
function supRows(list){
  return list.map(function(p){var c=calc(p.id);return{p:p,c:c,f:supFlags(p,c),e:supEvCount(c)}})
}
function supTotals(rows){
  var t={n:rows.length,total:0,spent:0,held:0,done:0,ev:0,expT:0,actT:0};
  rows.forEach(function(r){t.total+=r.c.total;t.spent+=r.c.spent;t.held+=r.c.held;t.done+=r.e.done;t.ev+=r.e.all;t.expT+=r.c.expTimes;t.actT+=r.c.actTimes});
  return t;
}
function supStrip(t){
  return'<div class="strip"><div><small>方案數</small><b>'+t.n+'</b></div><div><small>預算總額</small><b>$'+money(t.total)+'</b></div><div><small>已核銷</small><b>$'+money(t.spent)+'</b></div><div><small>預算執行率</small><b>'+pct(t.spent,t.total)+'%</b></div>'
   +(t.held?'<div><small>保留中(延展)</small><b style="color:var(--warn)">$'+money(t.held)+'</b></div>':'')
   +'<div><small>場次進度</small><b>'+t.done+' / '+t.ev+'</b></div><div><small>人次達成率</small><b>'+pct(t.actT,t.expT)+'%</b></div></div>';
}

function supMonthsOfEvents(){var m={};TS.events.forEach(function(e){if(e.date)m[e.date.slice(0,7)]=(m[e.date.slice(0,7)]||0)+1});return m}
function supAtt(){var m={};TS.attendances.forEach(function(a){var x=m[a.eventId]=m[a.eventId]||{times:0,ppl:{}};x.times+=Number(a.times)||0;(a.roster||[]).forEach(function(cd){x.ppl[a.kind+'|'+cd]=1})});return m}
function pjCmp(a,b){var x=supOwner(a)+'|'+(a.code||'')+'|'+(a.name||''),y=supOwner(b)+'|'+(b.code||'')+'|'+(b.name||'');return x>y?1:x<y?-1:0}
function evCmpPj(a,b){var pa=TS.projects.get(a.projectId)||{},pb=TS.projects.get(b.projectId)||{};if(a.projectId!==b.projectId)return pjCmp(pa,pb)||(a.projectId>b.projectId?1:-1);return evCmp(a,b)}
function evCmp(a,b){var pa=TS.projects.get(a.projectId)||{},pb=TS.projects.get(b.projectId)||{};
  return(a.date||'')>(b.date||'')?1:(a.date||'')<(b.date||'')?-1:(a.start||'')>(b.start||'')?1:(a.start||'')<(b.start||'')?-1:((pa.code||'')>(pb.code||'')?1:-1)}

  var h='<div class="phead"><div><h1>督導系統</h1><div class="sub" style="margin:0">整合全中心社工的方案資料,唯讀查看。'+(TM.at?'資料更新於 '+hm(TM.at)+'。':'')+'</div></div><div class="actions nosp"><button class="btn sm" data-a="supRefresh"'+(TM.loading?' disabled':'')+'>'+(TM.loading?'載入中…':'↻ 重新整理資料')+'</button></div></div>';
  if(!TS){
    return h+(TM.err?'<div class="note bad">'+esc(TM.err)+'</div><button class="btn" data-a="supRefresh">再試一次</button>':'<div class="note info" role="status">正在從 Google 雲端整合所有社工的資料,人數與照片多時可能需要十幾秒…</div>');
  }
  if(TM.err)h+='<div class="note bad">'+esc(TM.err)+'(目前顯示的是上一次載入的資料)</div>';
  var tabs=[['dash','中心總覽'],['ana','數據分析'],['poa','年度 POA(全中心)'],['mon','月度場次與照片']];
  h+='<div class="tabs nosp" role="tablist">'+tabs.map(function(t){return'<button role="tab" data-a="supsub" data-v="'+t[0]+'" aria-selected="'+(SV.sub===t[0])+'">'+t[1]+'</button>'}).join('')+'</div>';
  return h+withTeam(function(){return SV.sub==='ana'?supAna():SV.sub==='mon'?supMon():SV.sub==='poa'?supPoa():supDash()});
}
function supFilterBar(){
  var fy={},ce={},ow={};TS.projects.forEach(function(p){fy[p.fy||'FY26']=1;ce[p.center||'']=1;ow[p.owner]=1});
  var o=function(arr,cur,all){return'<option value="">'+all+'</option>'+arr.map(function(v){return'<option value="'+esc(v[0])+'"'+(cur===v[0]?' selected':'')+'>'+esc(v[1])+'</option>'}).join('')};
  var owners=Object.keys(ow).map(function(id){return[id,(TM.users[id]&&TM.users[id].name)||'(未知同工)']}).sort(function(a,b){return a[1]>b[1]?1:-1});
  var cs=Object.keys(ce).filter(Boolean).sort();
  var fl=function(l,k,html){return'<label style="display:grid;gap:.15rem;font-size:.8rem;color:var(--muted)">'+l+'<select data-sc="'+k+'">'+html+'</select></label>'};
  return'<div class="bar nosp" style="align-items:flex-end;margin:.2rem 0 1rem">'+fl('年度','fy',o(Object.keys(fy).sort().reverse().map(function(x){return[x,x]}),SV.fy,'全部年度'))
   +(cs.length>1?fl('中心','center',o(cs.map(function(x){return[x,x]}),SV.center,'全部中心')):'')
   +fl('社工','owner',o(owners,SV.owner,'全部社工'))+fl('狀態','st',o(['執行中','結案待報告','已結案'].map(function(x){return[x,x]}),SV.st,'全部狀態'))
   +'<label style="display:flex;gap:.35rem;align-items:center;font-size:.88rem;padding-bottom:.45rem"><input type="checkbox" data-sc="warn"'+(SV.warn?' checked':'')+'> 只看有警示的方案</label></div>';
}

/* ----- 1. 中心總覽 ----- */
function supDash(){
  var rows=supRows(supProjects()),tot=supTotals(rows),shown=SV.warn?rows.filter(function(r){return r.f.length}):rows;
  var wf=rows.filter(function(r){return r.f.length}).length,empty=Object.keys(TM.users).map(function(k){return TM.users[k]}).filter(function(u){return!u.n}).map(function(u){return u.name});
  var h=supFilterBar()+supStrip(tot);
  if(wf)h+='<div class="note warn" role="status">有 <b>'+wf+'</b> 個方案需要關注(預算、保留款、場次或紀錄不完整),表格最右欄有說明;勾選上方「只看有警示的方案」可只看這些。</div>';
  else if(rows.length)h+='<div class="note ok">目前沒有需要關注的方案。</div>';
  var bad=Object.keys(TM.users).map(function(k){return TM.users[k]}).filter(function(u){return u.err}).map(function(u){return u.name});
  if(bad.length)h+='<div class="note bad">以下帳號的雲端資料讀取失敗,方案可能沒有顯示出來:'+esc(bad.join('、'))+'。請按「重新整理資料」再試,仍失敗請聯絡管理員。</div>';
  if(empty.length)h+='<div class="note info">尚未有任何資料的帳號:'+esc(empty.join('、'))+'(可能還沒登入使用,或尚未同步)。</div>';
  var cnt={};TS.projects.forEach(function(p){cnt[p._src]=(cnt[p._src]||0)+1});
  h+='<details class="nosp" style="margin:0 0 1rem"><summary style="cursor:pointer;font-size:.88rem;color:var(--accent)">各社工資料概況(確認每位社工的資料是否都已同步進來)</summary><div class="tw"><table><thead><tr><th>社工</th><th>身分</th><th class="n">方案數</th><th class="n">雲端資料筆數</th><th>最後同步</th><th>狀態</th></tr></thead><tbody>'
   +Object.keys(TM.users).map(function(k){return TM.users[k]}).sort(function(a,b){return a.name>b.name?1:-1}).map(function(u){var c=cnt[u.id]||0,st=u.err?'讀取失敗':!u.n?'尚無資料':!c?'有資料但沒有方案':'正常';
     return'<tr><td>'+esc(u.name)+'</td><td>'+esc(u.role||'')+'</td><td class="n">'+c+'</td><td class="n">'+(u.n||0)+'</td><td>'+(u.at?new Date(u.at).toLocaleString('zh-TW',{hour12:false}):'—')+'</td><td'+(st==='正常'?'':' style="color:var(--warn)"')+'>'+st+'</td></tr>'}).join('')+'</tbody></table></div></details>';
  if(!shown.length)return h+'<div class="empty"><b>沒有符合條件的方案</b>請調整上方篩選條件。</div>';
  h+='<div class="tw"><table><thead><tr><th>社工</th><th>方案</th><th>月份</th><th>狀態</th><th class="n">預算</th><th class="n">已核銷</th><th>執行率</th><th class="n">場次</th><th class="n">人次達成</th><th>下次活動</th><th>警示</th></tr></thead><tbody>'
   +shown.map(function(r){var p=r.p,c=r.c;
     return'<tr><td>'+esc(supOwner(p))+'</td><td><button style="border:0;background:none;color:var(--accent);text-align:left;padding:0;font:inherit;cursor:pointer;text-decoration:underline" data-a="supProj" data-id="'+esc(p.id)+'">'+esc(p.name||'(未命名)')+'</button><div class="rem">'+esc(p.code||'')+(p.center?' ・ '+esc(p.center):'')+' ・ '+esc(p.fy||'FY26')+'</div></td><td>'+esc(p.month||'')+'</td><td><span class="pill '+pillCls(pst(p))+'">'+esc(pst(p))+'</span></td>'
      +'<td class="n">$'+money(c.total)+'</td><td class="n">$'+money(c.spent)+'</td><td>'+meterHtml(c.rate)+'</td><td class="n">'+r.e.done+' / '+r.e.all+'</td><td class="n">'+(c.expTimes?c.timeRate+'%':'—')+'</td><td>'+(c.next?esc(c.next.date.slice(5))+' '+esc(c.next.name):'—')+'</td>'
      +'<td>'+(r.f.length?r.f.map(function(x){return'<span class="flag warn" style="display:inline-block;margin:0 .2rem .2rem 0">'+esc(x)+'</span>'}).join(''):'<span class="rem">—</span>')+'</td></tr>'}).join('')
   +'</tbody></table></div>';

     +(cats.length?'<div class="tw"><table><thead><tr><th>類別</th><th class="n">預算</th><th class="n">已核銷</th><th class="n">保留</th><th class="n">餘額</th></tr></thead><tbody>'+cats.map(function(k){var bs=c.B.filter(function(b){return catOf(b)===k}),t=0,s=0,hd=0;bs.forEach(function(b){var x=budgetCalc(b);t+=Number(b.total)||0;s+=x.spent;hd+=x.held});
        return'<tr><td>'+esc(k)+'</td><td class="n">$'+money(t)+'</td><td class="n">$'+money(s)+'</td><td class="n">$'+money(hd)+'</td><td class="n">$'+money(t-s-hd)+'</td></tr>'}).join('')+'</tbody></table></div>':'<div class="rem">尚未建立預算</div>')
     +'</div><div class="foot"><button class="btn pri" data-a="mclose">關閉</button></div></div></div>';
    return h;

/* ----- 2. 數據分析 ----- */
function hbar(label,a,b,max,txt){
  var wa=max>0?a/max*100:0,wb=max>0?b/max*100:0;
  return'<div class="hb'+(a>0&&b>a?' over':'')+'"><span>'+esc(label)+'</span><span class="trk" role="img" aria-label="'+esc(label+':'+txt)+'"><i class="b" style="width:'+wa.toFixed(1)+'%"></i><i style="width:'+wb.toFixed(1)+'%"></i></span><span>'+esc(txt)+'</span></div>';
}
function catRank(c){var i=CATS.indexOf(c);return c==='未分類'||c==='未列入預算'?999:i>=0?i:500}
function supAnaData(){
  var list=supProjects(),ids={};list.forEach(function(p){ids[p.id]=p});
  var bm={},sm={},bc={},sc={};MONTHS.forEach(function(m){bm[m]=0;sm[m]=0});
  TS.budgets.forEach(function(b){if(!ids[b.projectId])return;var t=Number(b.total)||0;if(bm[b.month]!=null)bm[b.month]+=t;var k=catOf(b);bc[k]=(bc[k]||0)+t});
  list.forEach(function(p){var m=spentByMonth(p.id);Object.keys(m).forEach(function(k){if(sm[k]!=null)sm[k]+=m[k]})});
  TS.expenditures.forEach(function(e){if(!ids[e.projectId])return;var b=TS.budgets.get(e.budgetId),k=b?catOf(b):'未列入預算';sc[k]=(sc[k]||0)+(Number(e.amount)||0)});
  var ev={};TS.events.forEach(function(e){if(!ids[e.projectId]||!e.date)return;var k=e.date.slice(0,7),x=ev[k]=ev[k]||{done:0,wait:0,cancel:0};var s=evSt(e);if(s==='已辦理')x.done++;else if(s==='取消')x.cancel++;else x.wait++});
  var ek={},ak={};KINDS.forEach(function(k){ek[k]=0;ak[k]=0});
  TS.audiences.forEach(function(a){if(ids[a.projectId]&&ek[a.kind]!=null)ek[a.kind]+=Number(a.expTimes)||0});
  TS.attendances.forEach(function(a){if(ids[a.projectId]&&ak[a.kind]!=null)ak[a.kind]+=Number(a.times)||0});
  return{list:list,rows:supRows(list),bm:bm,sm:sm,bc:bc,sc:sc,ev:ev,ek:ek,ak:ak};
}
function supAna(){
  var D=supAnaData(),tot=supTotals(D.rows);
  var h=supFilterBar()+supStrip(tot)+'<div class="bar nosp" style="margin-bottom:1rem"><button class="btn" data-a="supXlsx">⬇ 匯出 Excel(方案進度、社工彙總、場次清單)</button></div>';
  if(!D.list.length)return h+'<div class="empty"><b>沒有符合條件的方案</b>請調整上方篩選條件。</div>';
  var lg='<div class="rem" style="margin-bottom:.4rem">淺色為預算,深色為已核銷(超出預算時變紅色)。</div>';
  var mx=0;MONTHS.forEach(function(m){mx=Math.max(mx,D.bm[m],D.sm[m])});
  h+='<section class="sec"><header>每月預算與核銷(依預算月份)</header><div class="body">'+lg+MONTHS.map(function(m){return hbar(m,D.bm[m],D.sm[m],mx,'$'+money(D.sm[m])+' / $'+money(D.bm[m]))}).join('')+'</div></section>';
  var cats=Object.keys(D.bc).concat(Object.keys(D.sc).filter(function(k){return D.bc[k]==null})).sort(function(a,b){return catRank(a)-catRank(b)||(a>b?1:-1)});
  mx=0;cats.forEach(function(k){mx=Math.max(mx,D.bc[k]||0,D.sc[k]||0)});
  h+='<section class="sec"><header>各經費類別的預算與核銷</header><div class="body">'+lg+cats.map(function(k){var a=D.bc[k]||0,b=D.sc[k]||0;return hbar(k,a,b,mx,'$'+money(b)+' / $'+money(a)+(a?'('+pct(b,a)+'%)':''))}).join('')+'</div></section>';
  var yms=Object.keys(D.ev).sort(),emx=0;yms.forEach(function(k){var x=D.ev[k];emx=Math.max(emx,x.done+x.wait+x.cancel)});
  h+='<section class="sec"><header>每月活動場次(依活動日期)</header><div class="body"><div class="rem" style="margin-bottom:.4rem"><span style="color:var(--ok)">■</span> 已辦理　<span style="color:var(--info)">■</span> 未辦理　<span style="color:var(--muted)">■</span> 取消</div>'
   +(yms.length?yms.map(function(k){var x=D.ev[k],t=x.done+x.wait+x.cancel,w=function(n){return(emx?n/emx*100:0).toFixed(1)+'%'};
     return'<div class="hb"><span>'+k.replace('-','/')+'</span><span class="trk" role="img" aria-label="'+k+' 已辦理'+x.done+' 未辦理'+x.wait+' 取消'+x.cancel+'" style="display:flex"><i style="position:static;width:'+w(x.done)+';background:var(--ok)"></i><i style="position:static;width:'+w(x.wait)+';background:var(--info)"></i><i style="position:static;width:'+w(x.cancel)+';background:var(--muted)"></i></span><span>'+x.done+' / '+t+' 場</span></div>'}).join(''):'<div class="rem">尚無場次</div>')+'</div></section>';
  mx=0;KINDS.forEach(function(k){mx=Math.max(mx,D.ek[k],D.ak[k])});
  h+='<section class="sec"><header>各對象參與人次(預期 vs 實際)</header><div class="body"><div class="rem" style="margin-bottom:.4rem">淺色為預期人次,深色為實際出席人次。</div>'
   +KINDS.filter(function(k){return D.ek[k]||D.ak[k]}).map(function(k){return hbar(k,D.ek[k],D.ak[k],mx,D.ak[k]+' / '+D.ek[k]+(D.ek[k]?'('+pct(D.ak[k],D.ek[k])+'%)':''))}).join('')+'</div></section>';
  var by_={};D.rows.forEach(function(r){var k=r.p.owner,x=by_[k]=by_[k]||{rows:[]};x.rows.push(r)});
  var oh=Object.keys(by_).map(function(k){var t=supTotals(by_[k].rows),u=TM.users[k]||{};return{k:k,name:u.name||'(未知同工)',t:t,at:u.at,warn:by_[k].rows.filter(function(r){return r.f.length}).length}}).sort(function(a,b){return a.name>b.name?1:-1});
  h+='<section class="sec"><header>社工彙總</header><div class="body flush"><div class="tw"><table><thead><tr><th>社工</th><th class="n">方案</th><th class="n">預算</th><th class="n">已核銷</th><th>執行率</th><th class="n">場次</th><th class="n">人次達成</th><th class="n">警示方案</th><th>最後同步</th></tr></thead><tbody>'
   +oh.map(function(o){return'<tr><td>'+esc(o.name)+'</td><td class="n">'+o.t.n+'</td><td class="n">$'+money(o.t.total)+'</td><td class="n">$'+money(o.t.spent)+'</td><td>'+meterHtml(pct(o.t.spent,o.t.total))+'</td><td class="n">'+o.t.done+' / '+o.t.ev+'</td><td class="n">'+(o.t.expT?pct(o.t.actT,o.t.expT)+'%':'—')+'</td><td class="n">'+(o.warn||'—')+'</td><td>'+(o.at?new Date(o.at).toLocaleString('zh-TW',{hour12:false}):'—')+'</td></tr>'}).join('')
   +'</tbody></table></div></div></section>';
  return h;
}
async function supXlsx(){
  var D=withTeam(supAnaData),att=withTeam(supAtt),sheets;
  var r1=[['社工','中心','事工編碼','方案名稱','年度','月份','狀態','預算總額','已核銷','執行率%','保留中','可用餘額','已辦理場次','全部場次','預期人次','實際人次','人次達成率%','警示']];
  D.rows.forEach(function(r){var p=r.p,c=r.c;r1.push([supOwner(p),p.center||'',p.code||'',p.name||'',p.fy||'FY26',p.month||'',pst(p),c.total,c.spent,c.rate,c.held,c.avail,r.e.done,r.e.all,c.expTimes,c.actTimes,c.timeRate,r.f.join('、')])});
  var by_={};D.rows.forEach(function(r){(by_[r.p.owner]=by_[r.p.owner]||[]).push(r)});
  var r2=[['社工','方案數','預算總額','已核銷','執行率%','已辦理場次','全部場次','預期人次','實際人次','人次達成率%','警示方案數']];
  Object.keys(by_).forEach(function(k){var t=supTotals(by_[k]);r2.push([(TM.users[k]&&TM.users[k].name)||'(未知同工)',t.n,t.total,t.spent,pct(t.spent,t.total),t.done,t.ev,t.expT,t.actT,pct(t.actT,t.expT),by_[k].filter(function(r){return r.f.length}).length])});
  var r3=[['日期','社工','中心','方案','活動名稱','狀態','地點','出席人次','照片數','有執行概況']],ids={};D.list.forEach(function(p){ids[p.id]=p});
  var evs=[];TS.events.forEach(function(e){if(ids[e.projectId])evs.push(e)});evs.sort(function(a,b){return withTeam(function(){return evCmp(a,b)})});
  evs.forEach(function(e){var p=TS.projects.get(e.projectId)||{},a=att[e.id];r3.push([evDate(e),supOwner(p),p.center||'',p.name||'',e.name||'',evSt(e),e.place||p.place||'',a?a.times:0,e.phN||0,String(e.summary||'').trim()?'是':'否'])});
  sheets=[{name:'方案進度',widths:[10,12,12,26,7,7,10,11,11,9,11,11,10,10,10,10,11,40],rows:r1},{name:'社工彙總',widths:[12,8,12,12,9,10,10,10,10,11,11],rows:r2},{name:'場次清單',widths:[22,10,12,24,28,8,16,10,8,10],rows:r3}];
  try{await downloads.save({filename:'督導彙整_'+today().replace(/-/g,'')+'.xlsx',data:xlsxBuild(sheets)});toast('已儲存 Excel')}catch(e){if(e&&e.code!=='declined')toast('下載失敗')}
}

/* ----- 3. 月度場次與照片 ----- */
function supMonList(){
  var out=[],q=SV.mq.trim().toLowerCase();
  TS.events.forEach(function(e){
    if(!e.date||e.date.slice(0,7)!==SV.mon)return;
    var p=TS.projects.get(e.projectId);if(!p)return;
    if(SV.mp&&e.projectId!==SV.mp)return;
    if(SV.mo&&p.owner!==SV.mo)return;
    if(SV.ms&&evSt(e)!==SV.ms)return;
    if(SV.mph&&!(e.phN>0))return;
    if(q&&(String(e.name||'')+' '+String(e.place||'')+' '+String(p.name||'')).toLowerCase().indexOf(q)<0)return;
    out.push(e)});
  return out.sort(evCmpPj);
}
function supSelEvents(){var r=[];Object.keys(SV.sel).forEach(function(id){if(!SV.sel[id])return;var e=TS.events.get(id);if(e&&e.date&&e.date.slice(0,7)===SV.mon)r.push(e)});return r.sort(evCmpPj)}
function supGroups(list){var gs=[];list.forEach(function(e){var g=gs[gs.length-1];if(!g||g.id!==e.projectId){g={id:e.projectId,list:[]};gs.push(g)}g.list.push(e)});return gs}
function supMon(){
  var ms=supMonthsOfEvents(),keys=Object.keys(ms).sort().reverse();

var SUP_DOC_MAX=480,SUP_DOC_Q=.6; /* 月報 Word 檔照片:最長邊像素、JPEG 品質(調小可縮小檔案) */
var SUP_DOC_W=290,SUP_DOC_H=300; /* 每格顯示寬、高上限(px),一列兩張 */
function smallImg(im){
  var sc=Math.min(1,SUP_DOC_MAX/Math.max(im.naturalWidth,im.naturalHeight)),cv=document.createElement('canvas');
  cv.width=Math.max(1,Math.round(im.naturalWidth*sc));cv.height=Math.max(1,Math.round(im.naturalHeight*sc));
  cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
  return{u:cv.toDataURL('image/jpeg',SUP_DOC_Q),w:cv.width,h:cv.height}}
function supSmallAll(evs){
  var jobs=[];
  evs.forEach(function(e){(phCache(e)||[]).forEach(function(x){if(x.su)return;jobs.push(new Promise(function(res){var im=new Image();im.onload=function(){try{var sm=smallImg(im);x.su=sm.u;x.sw=sm.w;x.sh=sm.h}catch(err){}res()};im.onerror=function(){res()};im.src=x.u}))})});
  return Promise.all(jobs)}
async function supFetchPh(evs,onStep){
  var need=evs.filter(function(e){return e.phN>0&&!phCache(e)});
  for(var i=0;i<need.length;i+=4){
    var b=need.slice(i,i+4),r=await window.__team.photos(b.map(function(e){return{uid:e._src,eventId:e.id}}));
    b.forEach(function(e){PHC[e.id]={n:e.phN,list:(r.photos&&r.photos[e.id])||[]}});
    await Promise.all(b.reduce(function(a,e){return a.concat(PHC[e.id].list.map(function(x){return new Promise(function(res){var im=new Image();im.onload=function(){x.w=im.naturalWidth;x.h=im.naturalHeight;try{var sm=smallImg(im);x.su=sm.u;x.sw=sm.w;x.sh=sm.h}catch(e){}res()};im.onerror=function(){res()};im.src=x.u})}))},[]));
    if(onStep)onStep(Math.min(need.length,i+4),need.length);
  }
}

function htmlToMht(html){
  var imgs=[],n=0,NL='\r\n';
  html=html.replace(/src="data:(image\/[a-z+]+);base64,([^"]+)"/g,function(m,t,b){n++;var loc='file:///C:/report/img'+n+'.'+(t.indexOf('png')>0?'png':'jpg');imgs.push({t:t,b:b,loc:loc});return'src="'+loc+'"'});
  var B='----=_NextPart_sup_'+Date.now(),wrap=function(x){return x.replace(/(.{76})/g,'$1'+NL)};
  var out='MIME-Version: 1.0'+NL+'Content-Type: multipart/related; boundary="'+B+'"; type="text/html"'+NL+NL+'--'+B+NL+'Content-Type: text/html; charset="utf-8"'+NL+'Content-Transfer-Encoding: base64'+NL+'Content-Location: file:///C:/report/report.htm'+NL+NL+wrap(btoa(unescape(encodeURIComponent(html))))+NL;
  imgs.forEach(function(i){out+=NL+'--'+B+NL+'Content-Type: '+i.t+NL+'Content-Transfer-Encoding: base64'+NL+'Content-Location: '+i.loc+NL+NL+wrap(i.b)+NL});
  return out+NL+'--'+B+'--'+NL;
}

/* ---------- boot ---------- */
async function boot(){
  var c=window.claude;
  if(!c||!c.use){failed='請在 claude.ai 內開啟這個頁面。';ready=true;render();return}
  try{
    db=await c.use('db');user=await c.use('user');downloads=await c.use('downloads');
  }catch(e){}
  if(!db){failed='需要登入 claude.ai 並由擁有者分享給你,才能讀寫資料。';ready=true;render();return}
  if(user){var me=await user.me();uid=me.id;profName=me.name||'';var can=await user.can('data.write');canWrite=can!==false}
  if(!uid){failed='無法取得你的身分,請重新登入後再開啟。';ready=true;render();return}
  var pending=COLS.length;
  COLS.forEach(function(col){
    var first=true;
    db.collection(col).onSnapshot(function(snap){
      var m=new Map();snap.docs.forEach(function(d){m.set(d.id,Object.assign({id:d.id},d.data()))});
      S[col]=m;
      if(first){first=false;pending--;if(pending===0){ready=true}}
      if(col==='projects')resolveNames();
      if(col==='budgets'||col==='budgetVersions')bvSchedule();
      if(ready)sched();
    },function(err){if(first){first=false;pending--;if(pending===0){ready=true;sched()}}});
  });
}
var nameKey='';
function resolveNames(){
  if(!user)return;
  var ids=[];S.projects.forEach(function(p){if(p.owner&&ids.indexOf(p.owner)<0)ids.push(p.owner)});
  var k=ids.sort().join(',');if(k===nameKey)return;nameKey=k;

}
